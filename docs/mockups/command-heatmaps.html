<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Terminal: Command heatmaps mockup</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<style>
:root{--water:#080812;--land:#0f0f1a;--border:#2a2a3e;--panel:rgba(15,15,26,.92);--line:rgba(255,255,255,.08);--text:#e7e7f0;--muted:#8d8da6;--low:#34d399;--medium:#fbbf24;--high:#f87171;--accent:#7c8cff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--water);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sidebar{width:240px;flex:none;background:var(--land);border-right:1px solid var(--border);padding:14px 10px}
.brand{font-weight:650;padding:4px 8px 16px}
.nav{display:flex;align-items:center;gap:10px;padding:8px;border-radius:7px;color:var(--muted)}
.nav.on{background:rgba(124,140,255,.14);color:var(--text)}
.nav i{width:16px;height:16px;border:1.5px solid currentColor;border-radius:4px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.crumb{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border);color:var(--muted)}
.crumb b{color:var(--text);font-weight:550}
.mock{margin-left:auto;font-size:11px;color:var(--medium);border:1px solid rgba(251,191,36,.35);border-radius:99px;padding:2px 9px}
.stage{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0}
.glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
.filters{position:absolute;left:12px;top:12px;z-index:3;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;width:250px}
.filters .t{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:2px 6px 4px}
.f{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;text-align:left;width:100%;color:var(--muted)}
.f:hover{background:rgba(255,255,255,.04)}
.f.on{background:rgba(255,255,255,.07);color:var(--text)}
.sw{width:26px;height:8px;border-radius:4px;flex:none}
.chip{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:auto;white-space:nowrap}
.right{position:absolute;top:12px;right:12px;width:320px;bottom:12px;border-radius:10px;padding:14px;overflow:auto;z-index:3}
.right h2{font-size:15px;margin:0 0 2px}.sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.sec{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.stat{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);gap:10px}
.risk{font-size:11px;font-weight:600}.risk.low{color:var(--low)}.risk.medium{color:var(--medium)}.risk.high{color:var(--high)}
.legend{position:absolute;left:12px;bottom:12px;z-index:3;border-radius:10px;padding:10px 12px;width:250px}
.ramp{height:8px;border-radius:4px;margin:6px 0 4px}
.lg{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.tip{position:absolute;z-index:4;pointer-events:none;border-radius:8px;padding:7px 9px;font-size:12px;display:none;white-space:nowrap}
.tip b{display:block}
.note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.5}
.need{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:24px}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">The Terminal</div>
  <div class="nav on"><i></i><span>Command</span></div>
  <div class="nav"><i></i><span>Products</span></div>
  <div class="nav"><i></i><span>Customers</span></div>
  <div class="nav"><i></i><span>Connections</span></div>
</aside>
<div class="main">
  <div class="crumb"><span>Command</span><span id="crumb"></span><span class="mock">Mockup: made-up numbers</span></div>
  <div class="stage">
    <div id="map"></div>
    <div class="filters glass" role="radiogroup" aria-label="Heatmap"><div class="t">Heatmap</div><div id="filters"></div></div>
    <div class="legend glass" id="legend"></div>
    <aside class="right glass" id="panel"></aside>
    <div class="tip glass" id="tip"></div>
  </div>
</div>
<script>
// MADE-UP data for the mockup. City level only; cities under MIN_ORDERS are left off (small-number rule).
const MIN_ORDERS = 5;
const NODES = [{name:'Rotterdam warehouse',at:[4.48,51.92]},{name:'Berlin store',at:[13.40,52.52]},{name:'Lyon warehouse',at:[4.84,45.76]}];
const CITIES = [
 ['Amsterdam',4.90,52.37,182,[150,210],1,1,3],['Rotterdam',4.48,51.92,96,[80,130],1,1,2],['Utrecht',5.12,52.09,74,[60,95],2,1,2],
 ['Brussels',4.35,50.85,88,[70,120],2,2,2],['Antwerp',4.40,51.22,41,[35,62],1,1,1],['Paris',2.35,48.86,211,[180,260],2,2,3],
 ['Lyon',4.84,45.76,63,[50,85],1,1,2],['Marseille',5.37,43.30,38,[30,58],3,3,1],['London',-0.13,51.51,240,[200,300],2,3,3],
 ['Manchester',-2.24,53.48,57,[45,80],3,3,1],['Berlin',13.40,52.52,156,[130,190],1,1,3],['Hamburg',9.99,53.55,72,[60,98],1,2,2],
 ['Munich',11.58,48.14,90,[75,120],2,1,2],['Cologne',6.96,50.94,66,[55,90],1,1,2],['Vienna',16.37,48.21,48,[38,70],2,2,1],
 ['Warsaw',21.01,52.23,35,[28,55],3,3,1],['Madrid',-3.70,40.42,52,[40,80],3,3,1],['Milan',9.19,45.46,61,[48,88],2,3,2],
 ['Copenhagen',12.57,55.68,29,[22,44],1,2,1],['Zurich',8.54,47.38,33,[25,50],1,1,2],['Prague',14.42,50.08,3,[1,6],2,2,1]
].map(([name,lng,lat,orders,demand,returns,delay,ftb])=>({name,lng,lat,orders,demand,returns,delay,ftb})).filter(c=>c.orders>=MIN_ORDERS);
const BAND=['','low','medium','high'];
// Band weights: low barely shows, so a cluster of low cities cannot add up to look high.
const BW=[0,0.08,0.5,1];
const LAYERS = {
 orders:{label:'Orders, last 14 days',source:'Shopify',ramp:['rgba(124,140,255,0)','#3b3f9e','#7c8cff','#c7ceff'],weight:c=>c.orders/240,
   value:c=>`${c.orders} orders`,legend:['fewer','more orders'],about:'Exact, from Shopify.'},
 demand:{label:'Demand, next 14 days',source:'Kumo',ramp:['rgba(45,212,191,0)','#0f766e','#2dd4bf','#ccfbf1'],weight:c=>(c.demand[0]+c.demand[1])/2/280,
   value:c=>`${c.demand[0]}–${c.demand[1]} units`,legend:['lower','higher demand'],about:'Estimate. Hover a city for the range.'},
 returns:{label:'Returns likely',source:'Kumo',ramp:['rgba(251,191,36,0)','#92400e','#fbbf24','#f87171'],weight:c=>BW[c.returns],
   value:c=>BAND[c.returns],band:c=>c.returns,legend:['low','high'],about:'Likelihood band per city.'},
 delay:{label:'Delivery delays likely',source:'Kumo',ramp:['rgba(232,121,249,0)','#86198f','#e879f9','#fae8ff'],weight:c=>BW[c.delay],
   value:c=>BAND[c.delay],band:c=>c.delay,legend:['low','high'],about:'Deliveries to customers only.'},
 ftb:{label:'First-time buyers coming back',source:'Kumo',ramp:['rgba(52,211,153,0)','#065f46','#34d399','#d1fae5'],weight:c=>BW[c.ftb],
   value:c=>BAND[c.ftb],band:c=>c.ftb,legend:['low','high'],about:'Likelihood band per city.'},
};
let active='orders', map;
const $=id=>document.getElementById(id);
function filters(){
  $('filters').innerHTML=Object.entries(LAYERS).map(([k,l])=>`<button class="f${k===active?' on':''}" role="radio" aria-checked="${k===active}" data-k="${k}"><span class="sw" style="background:linear-gradient(90deg,${l.ramp.slice(1).join(',')})"></span>${l.label}<span class="chip">${l.source}</span></button>`).join('');
  $('filters').querySelectorAll('.f').forEach(b=>b.onclick=()=>{active=b.dataset.k;render()});
}
function legend(){const l=LAYERS[active];$('legend').innerHTML=`<b>${l.label}</b><span class="chip" style="margin-left:6px">${l.source}</span><div class="ramp" style="background:linear-gradient(90deg,${l.ramp.slice(1).join(',')})"></div><div class="lg"><span>${l.legend[0]}</span><span>${l.legend[1]}</span></div><div class="note" style="margin-top:6px">${l.about}</div>`}
function panel(){
  const l=LAYERS[active];
  const top=[...CITIES].sort((a,b)=>l.weight(b)-l.weight(a)||b.orders-a.orders).slice(0,6);
  const val=c=>l.band?`<span class="risk ${BAND[l.band(c)]}">${BAND[l.band(c)][0].toUpperCase()+BAND[l.band(c)].slice(1)}</span>`:`<b>${l.value(c)}</b>`;
  $('panel').innerHTML=`<h2>${l.label}</h2><div class="sub">${l.source==='Kumo'?'Estimates for the next 14 days.':'Last 14 days, exact.'}</div><div class="sec">Top cities</div>`+
   top.map(c=>`<div class="stat"><span>${c.name}</span>${val(c)}</div>`).join('')+
   `<div class="note">City level only. Cities with fewer than ${MIN_ORDERS} orders are not shown, so no single customer can be picked out.</div>`;
  $('crumb').innerHTML=`/ <b>${l.label}</b>`;
}
function geo(){return {type:'FeatureCollection',features:CITIES.map(c=>({type:'Feature',geometry:{type:'Point',coordinates:[c.lng,c.lat]},properties:{name:c.name,w:LAYERS[active].weight(c),v:LAYERS[active].value(c)}}))}}
function paint(){
  if(!map||!map.getSource('cities'))return;
  map.getSource('cities').setData(geo());
  const r=LAYERS[active].ramp;
  map.setPaintProperty('heat','heatmap-color',['interpolate',['linear'],['heatmap-density'],0,r[0],0.3,r[1],0.65,r[2],1,r[3]]);
}
function render(){filters();legend();panel();paint()}
const token=new URLSearchParams(location.search).get('token')||localStorage.getItem('mapbox_token');
if(!token){$('map').innerHTML='<div class="need">Open with ?token=pk.… (your public Mapbox token) to see the globe.<br>The token is not stored in this file.</div>';render()}
else{
  localStorage.setItem('mapbox_token',token);
  mapboxgl.accessToken=token;
  map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/dark-v11',projection:'globe',center:[6,49],zoom:3.3,dragRotate:false,pitchWithRotate:false});
  map.on('load',()=>{
    const p=(layer,prop,val)=>{if(map.getLayer(layer))map.setPaintProperty(layer,prop,val)};
    p('water','fill-color','#080812');p('land','background-color','#0f0f1a');
    map.setFog({color:'#080812',range:[0.5,10],'horizon-blend':0.1});
    for(const l of map.getStyle().layers){if(/label|poi|road/.test(l.id))map.setLayoutProperty(l.id,'visibility',l.id==='country-label'?'visible':'none')}
    p('country-label','text-opacity',0.25);
    map.addSource('cities',{type:'geojson',data:geo()});
    map.addLayer({id:'heat',type:'heatmap',source:'cities',paint:{'heatmap-weight':['get','w'],'heatmap-intensity':1.2,'heatmap-radius':['interpolate',['linear'],['zoom'],2,28,6,60],'heatmap-opacity':0.85}});
    map.addLayer({id:'hit',type:'circle',source:'cities',paint:{'circle-radius':14,'circle-opacity':0}});
    for(const n of NODES){const el=document.createElement('div');el.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="#14142a" stroke="#7c8cff" stroke-width="2.5"/></svg>';el.title=n.name;new mapboxgl.Marker({element:el}).setLngLat(n.at).addTo(map)}
    const tip=$('tip');
    map.on('mousemove','hit',e=>{const f=e.features[0];tip.innerHTML=`<b>${f.properties.name}</b>${f.properties.v}<span class="chip" style="margin-left:6px">${LAYERS[active].source}</span>`;tip.style.display='block';tip.style.left=(e.point.x+14)+'px';tip.style.top=(e.point.y+14)+'px';map.getCanvas().style.cursor='pointer'});
    map.on('mouseleave','hit',()=>{tip.style.display='none';map.getCanvas().style.cursor=''});
    render();
  });
}
</script>
</body>
</html>
