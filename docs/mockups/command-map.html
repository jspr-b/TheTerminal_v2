<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Terminal: Command map mockup</title>
<style>
:root{--water:#080812;--land:#0f0f1a;--border:#2a2a3e;--panel:rgba(15,15,26,.92);--line:rgba(255,255,255,.08);--text:#e7e7f0;--muted:#8d8da6;--low:#34d399;--medium:#fbbf24;--high:#f87171;--accent:#7c8cff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--water);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sidebar{width:240px;flex:none;background:var(--land);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px;transition:width .2s ease}
.sidebar.collapsed{width:64px}
.brand{font-weight:650;padding:4px 8px 16px;white-space:nowrap;overflow:hidden}
.nav{display:flex;align-items:center;gap:10px;padding:8px;border-radius:7px;color:var(--muted);white-space:nowrap;width:100%;text-align:left}
.nav.on{background:rgba(124,140,255,.14);color:var(--text)}
.nav i{width:16px;height:16px;flex:none;border:1.5px solid currentColor;border-radius:4px}
.sidebar.collapsed .nav span,.sidebar.collapsed .brand span{display:none}
.spacer{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.crumb{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border);color:var(--muted)}
.crumb b{color:var(--text);font-weight:550}
.mock{margin-left:auto;font-size:11px;color:var(--medium);border:1px solid rgba(251,191,36,.35);border-radius:99px;padding:2px 9px}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
svg#map{position:absolute;inset:0;width:100%;height:100%}
.glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
.label{position:absolute;font-size:11px;white-space:nowrap;color:var(--text);pointer-events:none;text-shadow:0 1px 3px #000}
.right{position:absolute;top:12px;right:12px;width:320px;bottom:12px;border-radius:10px;padding:14px;overflow:auto;z-index:3}
.right h2{font-size:15px;margin:0 0 2px}.sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.sec{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.stat{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);gap:10px}
.chip{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:5px;white-space:nowrap}
.risk{font-size:11px;font-weight:600}.risk.low{color:var(--low)}.risk.medium{color:var(--medium)}.risk.high{color:var(--high)}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.card p{margin:4px 0 8px;color:var(--muted);font-size:12px}
.back{color:var(--accent);font-size:12px;margin-bottom:8px;display:block}
.dock{position:absolute;left:12px;right:344px;bottom:12px;z-index:2;display:flex;flex-direction:column;gap:8px;transition:none}
.timeline{border-radius:10px;padding:8px 14px 6px}
.tl-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.tl-head b{color:var(--text)}
.track{position:relative;height:40px;cursor:pointer;touch-action:none;margin-top:2px}
.rail{position:absolute;left:0;right:0;top:12px;height:2px;background:var(--border)}
.fill{position:absolute;left:0;top:12px;height:2px;background:var(--accent)}
.thumb{position:absolute;top:6px;width:14px;height:14px;border-radius:50%;background:var(--accent);transform:translateX(-50%);box-shadow:0 0 0 3px rgba(124,140,255,.25)}
.tick{position:absolute;top:24px;font-size:10px;color:var(--muted);transform:translateX(-50%)}.tick.on{color:var(--text);font-weight:600}
.drawer{border-radius:10px;overflow:hidden;display:flex;flex-direction:column;height:44px}
.drawer.open{height:280px}
.dr-head{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;width:100%;font-weight:550}
.dr-head span{color:var(--muted);font-weight:400;font-size:12px}
.tbl{overflow:auto;flex:1}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:#12121f;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;white-space:nowrap}
td{padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover td{background:rgba(255,255,255,.03)}tr.sel td{background:rgba(124,140,255,.12)}
.few{color:var(--muted);font-style:italic}
@keyframes pulse{0%{r:8;opacity:.8}100%{r:20;opacity:0}}.pulse{animation:pulse 1.8s ease-out infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="brand"><span>The Terminal</span></div>
  <button class="nav on"><i></i><span>Command</span></button>
  <button class="nav"><i></i><span>Products</span></button>
  <button class="nav"><i></i><span>Actions</span></button>
  <button class="nav"><i></i><span>Data</span></button>
  <div class="spacer"></div>
  <button class="nav" id="collapse"><i></i><span>Collapse</span></button>
</aside>
<div class="main">
  <div class="crumb"><span>Command</span><span id="crumb"></span><span class="mock">Mockup: made-up numbers</span></div>
  <div class="stage" id="stage">
    <svg id="map" role="img" aria-label="Map of locations and deliveries"></svg>
    <div id="labels"></div>
    <div class="dock">
      <div class="timeline glass">
        <div class="tl-head"><span>Day <b id="dayNow">0</b> of 14</span><span>Deliveries and stock by day</span></div>
        <div class="track" id="track" tabindex="0" role="slider" aria-label="Day" aria-valuemin="0" aria-valuemax="14">
          <div class="rail"></div><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div><div id="ticks"></div>
        </div>
      </div>
      <div class="drawer glass" id="drawer">
        <button class="dr-head" id="drHead"><div>Products <span>next 14 days</span></div><span id="drHint">Show</span></button>
        <div class="tbl"><table><thead><tr>
          <th>Product</th><th>Stock<span class="chip">Shopify</span></th><th>Will sell<span class="chip">Kumo</span></th><th id="byDay"></th><th>Risk<span class="chip">Our math</span></th><th>Out now<span class="chip">Shopify</span></th>
        </tr></thead><tbody id="rows"></tbody></table></div>
      </div>
    </div>
    <div class="right glass" id="panel"></div>
  </div>
</div>

  if(n.kind==='supplier')h+=`<circle cx="${x}" cy="${y}" r="7" ${st}/>`;else if(n.kind==='warehouse')h+=`<rect x="${x-7}" y="${y-7}" width="14" height="14" rx="3.5" ${st}/>`;else{const R=8.5,p=[];for(let i=0;i<6;i++)p.push((x+R*Math.cos(Math.PI/3*i)).toFixed(1)+','+(y+R*Math.sin(Math.PI/3*i)).toFixed(1));h+=`<polygon points="${p.join(' ')}" ${st}/>`}h+='</g>'}
 $('map').innerHTML=h;drawLabels()}
function drawLabels(){const box=$('labels');box.innerHTML='';const placed=[],dock=document.querySelector('.dock').getBoundingClientRect(),st=$('stage').getBoundingClientRect();const limit={r:VIEW.w-344,b:dock.top-st.top};for(const n of NODES){const [x,y]=VIEW.xy(n.at);placed.push({id:n.id,l:x-12,t:y-12,r:x+12,b:y+12})}
 for(const n of [...NODES].sort((a,b)=>a.at[0]-b.at[0])){const [x,y]=VIEW.xy(n.at),el=document.createElement('div');el.className='label';el.textContent=n.name;box.append(el);const w=el.offsetWidth,h=el.offsetHeight,opts=[[x+13,y-h/2],[x-13-w,y-h/2],[x-w/2,y-13-h],[x-w/2,y+13],[x+13,y-h-9],[x+13,y+9],[x-13-w,y-h-9],[x-13-w,y+9],[x-w/2,y-34-h],[x-w/2,y+34]];let got=null;for(const [l,t] of opts){const b={l,t,r:l+w,b:t+h};if(l<4||t<4||b.r>limit.r||b.b>limit.b)continue;if(placed.some(p=>p.id!==n.id&&b.l<p.r+3&&b.r>p.l-3&&b.t<p.b+3&&b.b>p.t-3))continue;got=b;break}if(!got){el.remove();continue}el.style.left=got.l+'px';el.style.top=got.t+'px';placed.push(got)}}
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
function chip(t){return `<span class="chip">${t}</span>`}
const riskTag=r=>r?`<span class="risk ${r}">${r[0].toUpperCase()+r.slice(1)}</span>`:'';
function soonCard(p){const out=runsOut(p,p.range[1]/14);return `<div class="card"><b>${p.name} could run out around day ${out}</b><p style="margin-bottom:0">At the top of the expected range.${chip('Our math')}</p></div>`}
function panel(){const p=$('panel');let h='',crumb='';
 if(!S.sel){const c={high:0,medium:0,low:0};PRODUCTS.forEach(x=>{const r=riskOf(x);if(r)c[r]++});const soon=PRODUCTS.filter(x=>x.range&&riskOf(x)!=='low').sort((a,b)=>runsOut(a,a.range[1]/14)-runsOut(b,b.range[1]/14));h=`<h2>Next 14 days</h2><div class="sub">Estimates, shown as ranges.</div><div class="stat"><span>High sell-out risk${chip('Our math')}</span><b>${plural(c.high,'product')}</b></div><div class="stat"><span>Medium sell-out risk${chip('Our math')}</span><b>${plural(c.medium,'product')}</b></div><div class="stat"><span>Out for delivery${chip('Shopify')}</span><b>${plural(SHIP.filter(s=>s.arrive>S.day).length,'delivery').replace('deliverys','deliveries')}</b></div><div class="sec">Could run out</div>${soon.map(soonCard).join('')}`}
 else{const back=`<button class="back" data-back="1">Back to overview</button>`;
  if(S.sel.t==='node'){const n=nodeOf(S.sel.id),pr=PRODUCTS.filter(x=>x.node===n.id),sh=SHIP.filter(s=>s.from===n.id);crumb=n.name;h=`${back}<h2>${n.name}</h2><div class="sub" style="text-transform:capitalize">${n.kind}</div><div class="sec">Products here</div>`+pr.map(x=>`<div class="stat"><span>${x.name}</span>${x.range?riskTag(riskOf(x)):'<span class="few">too few sales</span>'}</div>`).join('')+`<div class="sec">Deliveries out</div>`+sh.map(s=>`<div class="stat"><span>${s.id} to ${s.to}</span><span>day ${s.arrive}</span></div>`).join('')}
  else if(S.sel.t==='ship'){const s=SHIP.find(x=>x.id===S.sel.id),x=prodOf(s.product);crumb=s.id;h=`${back}<h2>${s.id}</h2><div class="sub">${nodeOf(s.from).name} to ${s.to}</div><div class="stat"><span>Carries${chip('Shopify')}</span><b>${s.qty} ${x.name}</b></div><div class="stat"><span>Expected${chip('Shopify')}</span><b>Day ${s.arrive}</b></div>`}
  else{const x=prodOf(S.sel.id);crumb=x.name;h=`${back}<h2>${x.name}</h2><div class="sub">${nodeOf(x.node).name}</div><div class="stat"><span>Stock today${chip('Shopify')}</span><b>${x.stock}</b></div>`+(x.range?`<div class="stat"><span>Will sell, 14 days${chip('Kumo')}</span><b>${rangeText(x)}</b></div><div class="stat"><span>Stock on day ${S.day}${chip('Our math')}</span><b>${stockAt(x,S.day)}</b></div><div class="stat"><span>Sell-out risk${chip('Our math')}</span>${riskTag(riskOf(x))}</div>`+(riskOf(x)!=='low'?`<div class="sec">Could run out</div>${soonCard(x)}`:''):`<div class="stat"><span class="few">Too few sales to predict</span></div>`)}}
 p.innerHTML=h;$('crumb').innerHTML=crumb?`/ <b>${crumb}</b>`:''}
function rows(){const out=PRODUCTS.map(p=>{const r=riskOf(p),way=SHIP.filter(s=>s.product===p.id&&s.arrive>S.day).reduce((a,s)=>a+s.qty,0)||'None',sel=S.sel&&S.sel.t==='product'&&S.sel.id===p.id?' sel':'';return `<tr class="row${sel}" data-prod="${p.id}" tabindex="0"><td>${p.name}</td><td>${p.stock}</td>`+(p.range?`<td>${rangeText(p)}</td><td>${stockAt(p,S.day)}</td><td>${riskTag(r)}</td>`:`<td class="few" colspan="3">too few sales to predict</td>`)+`<td>${way}</td></tr>`}).join('');$('rows').innerHTML=out;$('byDay').innerHTML=`Day ${S.day} stock${chip('Our math')}`}
function timeline(){const pct=S.day/14*100;$('thumb').style.left=pct+'%';$('fill').style.width=pct+'%';$('dayNow').textContent=S.day;$('track').setAttribute('aria-valuenow',S.day);let h='';for(let i=0;i<=14;i++)h+=`<span class="tick${i===S.day?' on':''}" style="left:${i/14*100}%">${i}</span>`;$('ticks').innerHTML=h}
function all(){fit();drawMap();panel();rows();timeline()}
function setDay(d){d=Math.max(0,Math.min(14,d));if(d===S.day)return;S.day=d;drawMap();rows();timeline();panel()}
function select(sel){S.sel=sel;drawMap();panel();rows()}
const trk=$('track');function fromEvent(e){const r=trk.getBoundingClientRect();setDay(Math.round((e.clientX-r.left)/r.width*14))}
trk.addEventListener('pointerdown',e=>{trk.setPointerCapture(e.pointerId);fromEvent(e)});trk.addEventListener('pointermove',e=>{if(e.buttons)fromEvent(e)});
trk.addEventListener('keydown',e=>{if(e.key==='ArrowRight')setDay(S.day+1);if(e.key==='ArrowLeft')setDay(S.day-1)});
$('map').addEventListener('click',e=>{const n=e.target.closest('[data-node]'),s=e.target.closest('[data-ship]');if(n)select({t:'node',id:n.dataset.node});else if(s)select({t:'ship',id:s.dataset.ship});else select(null)});
$('rows').addEventListener('click',e=>{const r=e.target.closest('[data-prod]');if(r)select({t:'product',id:r.dataset.prod})});
$('rows').addEventListener('keydown',e=>{if(e.key==='Enter'){const r=e.target.closest('[data-prod]');if(r)select({t:'product',id:r.dataset.prod})}});
$('panel').addEventListener('click',e=>{if(e.target.dataset.back)select(null)});
$('drHead').addEventListener('click',()=>{S.drawer=!S.drawer;$('drawer').classList.toggle('open',S.drawer);$('drHint').textContent=S.drawer?'Hide':'Show';all()});
$('collapse').addEventListener('click',()=>{$('sidebar').classList.toggle('collapsed');setTimeout(all,220)});
new ResizeObserver(all).observe($('stage'));
all();
</script>
</body>
</html>
