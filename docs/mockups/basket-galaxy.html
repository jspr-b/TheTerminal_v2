<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Terminal: bought together and track record (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1"></script>
<style>
:root{--water:#05050c;--panel:#0f0f1c;--edge:#22223a;--line:rgba(255,255,255,.07);--text:#e7e7f0;--muted:#8d8da6;--dim:#55556d;--accent:#7c8cff;
  --sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--water);color:var(--text);font:13px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{height:50px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--edge)}
.top .brand{font-weight:600}.top .where{color:var(--muted)}
.seg{display:flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden;margin-left:12px}
.seg button{padding:5px 12px;color:var(--muted)}.seg button.on{background:rgba(124,140,255,.16);color:var(--text)}
.mock{margin-left:auto;font-size:11px;color:#fbbf24;border:1px solid rgba(251,191,36,.35);border-radius:99px;padding:2px 9px}
.view{flex:1;min-height:0;display:none}.view.on{display:flex}
/* galaxy */
.stage{flex:1;min-width:0;position:relative;background:#0a0a12;overflow:hidden}
/* soft vignette in the app's colours: a little lighter and bluer in the middle, near black at the edges */
.stage::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 70% at 50% 46%,#121427 0%,#0b0b15 55%,#06060b 100%)}
#graph{z-index:1}
#panel.fade>*{animation:fadein .35s ease both}@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--edge);border:1px solid var(--edge);border-radius:8px;overflow:hidden}
.facts div{background:var(--panel);padding:8px 10px;display:flex;flex-direction:column;gap:2px}.facts span{font-size:11px;color:var(--muted)}.facts b{font-weight:500}.facts small{color:var(--muted);font-weight:400;margin-left:4px}
.graphline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:12px}.graphline i{font-style:normal;padding:3px 8px;border:1px solid var(--edge);border-radius:999px;color:var(--text)}.graphline em{font-style:normal;color:var(--dim)}
.mv{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}.mv b{font-weight:500}.mv:hover b{color:#fff}
.lvl{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--edge);color:var(--muted)}.lvl.strong{color:#c3c9ff;border-color:rgba(124,140,255,.5)}.lvl.medium{color:#a9aed8}
.time{position:absolute;left:18px;right:18px;bottom:16px;z-index:3;display:flex;align-items:center;gap:14px;padding:10px 14px 8px;border:1px solid var(--edge);border-radius:10px;background:rgba(12,12,22,.82);backdrop-filter:blur(6px)}
#play{width:30px;height:30px;flex:none;border-radius:50%;border:1px solid var(--edge);color:var(--text);font-size:11px;background:#14142a}
#play:hover{border-color:var(--accent)}
.track{position:relative;flex:1;height:34px}
.rail{position:absolute;left:0;right:0;top:9px;height:2px}
.rail .past{position:absolute;left:0;width:66.667%;height:2px;background:#5a5f8c}
.rail .ahead{position:absolute;left:66.667%;right:0;height:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 5px,transparent 5px 9px)}
.track input{position:absolute;left:-7px;right:-7px;width:calc(100% + 14px);top:0;height:20px;margin:0;background:transparent;-webkit-appearance:none;appearance:none}
.track input::-webkit-slider-runnable-track{height:20px;background:transparent}
.track input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:3px;border-radius:50%;background:#fff;border:3px solid #0a0a12;box-shadow:0 0 0 1px #fff}
.track input::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid #0a0a12}
.marks{position:absolute;left:0;right:0;top:20px;font-size:11px;color:var(--muted)}.marks span{position:absolute;white-space:nowrap}
.readout{flex:none;width:220px;font-size:12px;color:var(--muted);text-align:right}.readout b{color:var(--text);font-weight:500}
.chip{white-space:nowrap}.chip.kumo{color:#c3c9ff;border-color:rgba(124,140,255,.45)}
.spark .ax{fill:#6c6c86;font:10px "IBM Plex Sans",sans-serif}
.dayline{margin:6px 0 4px;color:var(--muted);font-size:13px}.dayline b{color:var(--text);font-weight:500}
.key{margin-top:16px;display:grid;gap:7px;font-size:12px;color:var(--muted)}.key span{color:var(--dim);margin-left:4px}
.key i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.k-solid{background:#8f98d9}.k-ring{border:1.5px solid #8f98d9;box-shadow:0 0 0 2.5px #0f0f1c,0 0 0 3.5px rgba(143,152,217,.4)}
.k-dots{background:radial-gradient(circle,#c9cdf0 1.5px,transparent 2px) 0 50%/5px 5px repeat-x;border-radius:0!important}
.floorseg{position:absolute;right:16px;top:14px;z-index:2;display:flex;border:1px solid var(--edge);border-radius:7px;overflow:hidden;background:rgba(15,15,28,.85)}
.floorseg button{padding:4px 11px;color:var(--muted);font-size:12px}.floorseg button.on{background:rgba(124,140,255,.14);color:var(--text)}

#graph{position:absolute;inset:0}
.stage .hint{position:absolute;right:18px;top:16px;color:var(--muted);font-size:12px;pointer-events:none;z-index:2}
.stage .keys{z-index:2;position:absolute;left:18px;top:16px;display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);pointer-events:none}
.stage .keys i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
aside{width:340px;flex:none;border-left:1px solid var(--edge);background:var(--panel);padding:18px;overflow:auto}
h2{font-size:17px;margin:0 0 4px;font-weight:600}.sub{color:var(--muted);margin:0 0 16px}
.sec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.chip{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 5px;text-transform:none;letter-spacing:0}
.pair{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pair:hover b{color:#fff}.pair b{font-weight:500}.pair span{color:var(--muted);font-size:12px}
.bar{grid-column:1/3;height:3px;border-radius:2px;background:rgba(255,255,255,.06)}.bar div{height:3px;border-radius:2px;background:var(--accent)}
.back{color:var(--accent);font-size:12px;margin-bottom:12px}
/* track record */
#cards{flex:1;overflow:auto;padding:26px 28px 40px}
#cards h1{font-size:20px;margin:0 0 4px;font-weight:600}#cards .lede{color:var(--muted);margin:0 0 22px;max-width:720px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{aspect-ratio:4/5;border-radius:18px;padding:22px;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:#0f0f1c;border:1px solid var(--edge)}
.card::before{content:'';position:absolute;left:22px;right:22px;top:0;height:2px;background:var(--accent);opacity:.9}
.card.miss::before{background:var(--dim)}
.card.miss{background:#0f0f1c}
.card .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .name{font-size:19px;font-weight:600;margin-top:6px}
.card .big{font-family:var(--mono);font-size:56px;line-height:1;margin-top:auto;letter-spacing:-.02em}
.card .big small{font-size:14px;color:var(--muted);font-family:var(--sans);letter-spacing:0;margin-left:8px}
.card svg{margin:18px 0 10px;overflow:visible}
.card .verdict{font-size:15px;font-weight:500}.card .verdict.in{color:#a5afff}.card .verdict.out{color:var(--muted)}
.card .foot{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.card.sum .big{font-size:84px}
.dots{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #a5afff}.dots i.on{background:#a5afff}
.nlabel{font:500 11px "IBM Plex Sans",sans-serif;color:rgba(231,231,240,.82);white-space:nowrap;transform:translateY(4px);pointer-events:none;transition:opacity .25s;text-shadow:0 1px 3px #000}
.nlabel.sel{color:#fff;font-weight:600}
.tipbox{font:12px "IBM Plex Sans",sans-serif;padding:5px 8px;background:#16162a;border:1px solid #22223a;border-radius:6px;color:#e7e7f0}.tipbox span{color:#8d8da6}
#tip{position:fixed;z-index:20;pointer-events:none;background:#16162a;border:1px solid var(--edge);border-radius:7px;padding:6px 9px;font-size:12px;display:none}
</style>
</head>
<body>
<div class="top"><span class="brand">The Terminal</span><span class="where">Products</span>
  <div class="seg" role="group" aria-label="View"><button data-view="galaxy" class="on">Bought together</button><button data-view="record">Track record</button></div>
  <span class="mock">Mockup: made-up numbers</span></div>

<div class="view on" id="v-galaxy">
  <div class="stage" id="stage"><div id="graph"></div><div class="keys" id="keys"></div><div class="hint">Drag to rotate · scroll to zoom · click a product</div>
    <div class="time"><button id="play" aria-label="Play">▶</button>
      <div class="track"><div class="rail"><i class="past"></i><i class="ahead"></i></div><input type="range" id="t" min="-28" max="14" step="0.01" value="0" aria-label="Day">
        <div class="marks"><span style="left:0">28 days ago</span><span style="left:66.667%;transform:translateX(-50%)">Today</span><span style="right:0">+14 days</span></div></div>
      <div class="readout" id="readout"></div></div></div>
  <aside id="panel"></aside>
</div>
<div class="view" id="v-record"><div id="cards"></div></div>
<div id="tip"></div>

<script type="module">

/* ---------- made-up shop: products, units sold in 28 days, shared orders ---------- */
let seed = 5; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const TYPES = { Shirts: '#7c8cff', Bags: '#2dd4bf', Accessories: '#f0abfc', Outerwear: '#fbbf24', Knitwear: '#93c5fd', Art: '#fda4af' };
const P = [['Linen Shirt','Shirts',262],['Oxford Shirt','Shirts',140],['Camp Collar Shirt','Shirts',96],['Cotton Tee','Shirts',310],['Canvas Tote','Bags',330],
  ['Market Bag','Bags',88],['Weekender','Bags',41],['Wool Scarf','Accessories',75],['Leather Belt','Accessories',54],['Silk Tie','Accessories',38],['Card Holder','Accessories',120],
  ['Bucket Hat','Accessories',66],['Denim Jacket','Outerwear',62],['Rain Shell','Outerwear',47],['Chore Coat','Outerwear',35],['Merino Crew','Knitwear',90],
  ['Knit Beanie','Knitwear',110],['Cable Cardigan','Knitwear',44],['Limited Print','Art',6],['Poster Set','Art',28]];
const nodes = P.map(([name, type, sold], id) => ({ id, name, type, sold, neighbors: [], links: [] }));
const pairs = {};
const bump = (a, b, n) => { if (a === b) return; const k = a < b ? `${a}-${b}` : `${b}-${a}`; pairs[k] = (pairs[k] || 0) + n; };
bump(0, 4, 135); bump(3, 4, 64); bump(0, 8, 22); bump(12, 3, 30); bump(15, 16, 41); bump(7, 16, 37); bump(10, 8, 26); bump(5, 4, 12); bump(13, 11, 15); bump(18, 19, 3);
bump(1, 9, 18); bump(14, 12, 9); bump(17, 7, 11); bump(6, 10, 7); bump(2, 11, 14);
for (let i = 0; i < 40; i++) { const a = fl(rnd() * nodes.length), b = fl(rnd() * nodes.length); bump(a, b, 2 + fl(rnd() * 6)); }
function fl(x) { return Math.floor(x); }
const MIN_SHARED = 2; // same rule as the API: at least 2 shared orders
const links = Object.entries(pairs).filter(([, n]) => n >= MIN_SHARED).map(([k, n]) => { const [s, t] = k.split('-').map(Number); return { source: s, target: t, orders: n }; });
links.forEach(l => { const a = nodes[l.source], b = nodes[l.target]; a.neighbors.push(b); b.neighbors.push(a); a.links.push(l); b.links.push(l); });
const maxOrders = Math.max(...links.map(l => l.orders));

/* ---------- made-up daily history (Shopify) and 14-day forecast (Kumo), per product and per pair ---------- */
const PAST = 28, AHEAD = 14;
const week = d => 1 + 0.18 * Math.sin((d + 2) * 2 * Math.PI / 7);
nodes.forEach(n => {
  const r0 = n.sold / PAST, trend = (rnd() - 0.4) * 0.02;
  n.trend = trend;
  n.actual = [];  // index 0 = 28 days ago ... 27 = yesterday
  for (let d = -PAST; d < 0; d++) n.actual.push(Math.max(0, Math.round(r0 * (1 + trend * d) * week(d) * (0.75 + 0.5 * rnd()))));
  n.sold = n.actual.reduce((a, b) => a + b, 0);
  n.fc = [];      // index 0 = tomorrow ... 13 = in 14 days: [low, likely, high] units that day
  for (let d = 1; d <= AHEAD; d++) { const m = r0 * (1 + trend * d) * week(d), w = 0.22 + 0.035 * d;
    n.fc.push([Math.max(0, Math.floor(m * (1 - w))), Math.round(m), Math.ceil(m * (1 + w))]); }
});
links.forEach(l => {
  const a = nodes[l.source], b = nodes[l.target];
  // Dots flow from the product usually bought first to the one bought next (made-up direction).
  if (b.sold > a.sold) { l.source = b.id; l.target = a.id; }
  const r0 = l.orders / PAST, tr = (a.trend + b.trend) / 2;
  l.actual = []; for (let d = -PAST; d < 0; d++) l.actual.push(Math.max(0, r0 * (1 + tr * d) * week(d) * (0.7 + 0.6 * rnd())));
  l.fc = []; for (let d = 1; d <= AHEAD; d++) { const m = r0 * (1 + tr * d) * week(d), w = 0.3 + 0.04 * d; l.fc.push([m * (1 - w), m, m * (1 + w)]); }
});
// Smoothed value on a slider day: past = what sold (7-day average), future = Kumo's range (3-day average).
function at(x, day) {
  const avg = (arr, a, b, f = v => v) => { a = Math.max(0, a); b = Math.min(arr.length - 1, b); let s = 0; for (let i = a; i <= b; i++) s += f(arr[i]); return s / (b - a + 1); };
  if (day <= 0) { const i = day === 0 ? PAST - 4 : PAST + day; const m = avg(x.actual, i - 3, i + 3); return { lo: m, md: m, hi: m, fut: false }; }
  const i = day - 1;
  return { lo: avg(x.fc, i - 1, i + 1, v => v[0]), md: avg(x.fc, i - 1, i + 1, v => v[1]), hi: avg(x.fc, i - 1, i + 1, v => v[2]), fut: true };
}
nodes.forEach(n => {
  n.orders = Math.round(n.sold * (0.8 + 0.1 * rnd()));
  n.customers = Math.round(n.orders * (0.78 + 0.12 * rnd()));
  n.repeat = Math.round(n.customers * (0.06 + 0.12 * rnd()));
  n.returned = Math.round(n.sold * (0.01 + 0.05 * rnd()));
  const last14 = n.actual.slice(14).reduce((a, b) => a + b, 0), prev14 = n.actual.slice(0, 14).reduce((a, b) => a + b, 0);
  n.trendWord = last14 > prev14 * 1.08 ? 'Rising' : last14 < prev14 * 0.92 ? 'Falling' : 'Steady';
  n.last14 = last14; n.prev14 = prev14;
  const byDow = [0, 0, 0, 0, 0, 0, 0]; n.actual.forEach((v, i) => { byDow[new Date(Date.UTC(2026, 10, 18) + (i - 28) * 864e5).getUTCDay()] += v; });
  n.busiest = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][byDow.indexOf(Math.max(...byDow))];
});
// How closely two products' daily sales go up and down together (Pearson over the 28 days), shown as a word.
function corr(a, b) {
  const n = a.length, ma = a.reduce((s, v) => s + v, 0) / n, mb = b.reduce((s, v) => s + v, 0) / n;
  let x = 0, y = 0, z = 0; for (let i = 0; i < n; i++) { x += (a[i] - ma) * (b[i] - mb); y += (a[i] - ma) ** 2; z += (b[i] - mb) ** 2; }
  return y && z ? x / Math.sqrt(y * z) : 0;
}
const corrWord = r => r > 0.6 ? 'strong' : r > 0.4 ? 'medium' : 'weak';
let day = 0;          // shown day (moves smoothly)
let target = 0;       // where the slider points
// Values between two whole days blend smoothly, so nothing jumps.
function atF(x, d) {
  const a = Math.floor(d), b = Math.ceil(d), f = d - a;
  if (a === b) return at(x, a);
  const A = at(x, a), B = at(x, b);
  return { lo: A.lo + (B.lo - A.lo) * f, md: A.md + (B.md - A.md) * f, hi: A.hi + (B.hi - A.hi) * f, fut: d > 0 };
}

/* ---------- bought together: a calm 3D map (3d-force-graph), own node objects so past and future can look different ---------- */
const REV = String(window.__THREE__ || '186').replace(/\D/g, '');
const { CSS2DRenderer, CSS2DObject } = await import(`https://esm.sh/three@0.${REV}.0/examples/jsm/renderers/CSS2DRenderer.js`);
const T3 = await import(`https://esm.sh/three@0.${REV}.0`);
const MUTED = { Shirts: '#8f98d9', Bags: '#7fbfb6', Accessories: '#c8a6cc', Outerwear: '#cdb27a', Knitwear: '#8fb0cf', Art: '#cf9aa3' };
const ACCENT = '#7c8cff', DIM = '#20202f';
const hiNodes = new Set(), hiLinks = new Set(); let focus = null, hover = null, Graph = null;
const el = document.getElementById('graph');
const topIds = new Set([...nodes].sort((a, b) => b.sold - a.sold).slice(0, 8).map(n => n.id));
const lit = n => !focus || hiNodes.has(n);
const labels = new Map();
const rad = perDay => 2.6 * Math.cbrt(1 + perDay * PAST / 12);   // same size scale as "sold in 28 days"
const maxPair = Math.max(...links.map(l => l.orders / PAST));
const st = l => Math.min(1, atF(l, day).md / maxPair);
const strength = l => l.orders / maxOrders;

const sphereGeo = new T3.SphereGeometry(1, 28, 18);
function nodeObject(n) {
  const g = new T3.Group();
  const mat = new T3.MeshLambertMaterial({ color: MUTED[n.type] });
  const sphere = new T3.Mesh(sphereGeo, mat);
  const d = document.createElement('div'); d.className = 'nlabel'; d.textContent = n.name; d.style.opacity = topIds.has(n.id) ? '1' : '0';
  labels.set(n.id, d);
  const lab = new CSS2DObject(d);
  g.add(sphere, lab);
  n.__v = { mat, sphere, lab };
  paintNode(n); colorNode(n);
  return g;
}
function paintNode(n) {      // size only: runs every frame
  const v = n.__v; if (!v) return;
  const r = rad(atF(n, day).md); n.__r = r;
  v.sphere.scale.setScalar(r); v.lab.position.set(0, -(r + 4), 0);
}
const C = c => new T3.Color(c);
function colorNode(n) {      // sets the colour to fade to; the frame loop does the fading
  const v = n.__v; if (!v) return;
  v.to = C(n === focus ? ACCENT : lit(n) ? MUTED[n.type] : DIM);
}
function styleLabels() {
  for (const n of nodes) {
    const d = labels.get(n.id); if (!d) continue;
    d.style.opacity = (n === focus || n === hover || (focus ? hiNodes.has(n) : topIds.has(n.id))) ? '1' : '0';
    d.classList.toggle('sel', n === focus);
  }
}
const tipText = n => { const day = Math.round(target);
  if (day > 0) { const [lo, md, hi] = n.fc[day - 1]; return `${n.name}<br><span>In ${day} day${day > 1 ? 's' : ''}: likely ${lo}–${hi} sold that day</span>`; }
  if (day < 0) return `${n.name}<br><span>${-day} day${day < -1 ? 's' : ''} ago: ${n.actual[PAST + day]} sold</span>`;
  return `${n.name}<br><span>${n.sold} sold in 28 days · ${n.links.length} pairings</span>`;
};

Graph = new ForceGraph3D(el, { controlType: 'orbit', extraRenderers: [new CSS2DRenderer()] })
  .showNavInfo(false).backgroundColor('rgba(0,0,0,0)')
  .graphData({ nodes, links })
  .nodeThreeObject(nodeObject).nodeThreeObjectExtend(false)
  .nodeLabel(n => `<div class="tipbox">${tipText(n)}</div>`)
  .linkThreeObject(linkObject)
  .linkPositionUpdate(placeLink)
  .onNodeClick(select).onBackgroundClick(() => select(null))
  .onNodeHover(n => { hover = n || null; el.style.cursor = n ? 'pointer' : ''; styleLabels(); })
  .cooldownTime(3500);
// Dots stay the same over time (no rebuilds): strong pairs, or the selected product's pairs. They flow from "bought first" to "bought next".
const dotGeo = new T3.SphereGeometry(1, 10, 8);
function makeDots(l) {
  l.dots = [0, 0.5].map(o => { const m = new T3.Mesh(dotGeo, new T3.MeshBasicMaterial({ color: '#dfe2ff', transparent: true, opacity: 0, depthWrite: false })); m.__o = o; Graph.scene().add(m); return m; });
  l.dotsNow = 0;
}
const cylGeo = new T3.CylinderGeometry(1, 1, 1, 10, 1, true); cylGeo.rotateX(Math.PI / 2);
function linkObject(l) {

const held = REC.filter(r => r[4] >= r[1] && r[4] <= r[3]).length;
document.getElementById('cards').innerHTML = `<h1>Track record</h1>
  <p class="lede">Every 14 days, what Kumo said next to what really sold. Made to be shared: each card is a square-ish image. A white dot inside the band means Kumo's range held.</p>
  <div class="grid">
   <div class="card sum"><span class="k">${dname(-14)} – ${dname(-1)}</span><span class="name">Kumo's ranges held for</span>
     <div class="big">${held}<small>of ${REC.length} products</small></div>
     <div class="dots">${REC.map(r => `<i class="${r[4] >= r[1] && r[4] <= r[3] ? 'on' : ''}" title="${r[0]}"></i>`).join('')}</div>
     <div class="foot"><span>The Terminal · Kumo + Shopify</span><span>Made-up shop</span></div></div>
   ${REC.map(([name, lo, md, hi, act]) => { const inside = act >= lo && act <= hi, word = inside ? 'Inside Kumo\'s range' : act > hi ? 'Sold more than Kumo\'s range' : 'Sold less than Kumo\'s range';
     return `<div class="card ${inside ? '' : 'miss'}"><span class="k">Kumo said, ${dname(-14)}</span><span class="name">${name}</span>
       <div class="big">${act}<small>sold in 14 days</small></div>${bandSvg(lo, md, hi, act)}
       <span class="verdict ${inside ? 'in' : 'out'}">${word}</span>
       <div class="foot"><span class="num">Range ${lo}–${hi}</span><span>Kumo + Shopify</span></div></div>`; }).join('')}
  </div>`;

/* ---------- view switch ---------- */
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('v-galaxy').classList.toggle('on', b.dataset.view === 'galaxy');
  document.getElementById('v-record').classList.toggle('on', b.dataset.view === 'record');
  if (b.dataset.view === 'galaxy' && Graph) fitSize();
});

/* ---------- embed mode, used by the product stage mockup: ?embed=1&view=galaxy|record&focus=<product name> ---------- */
const Q = new URLSearchParams(location.search);
if (Q.has('embed')) { document.querySelector('.top').style.display = 'none'; fitSize(); }
if (Q.get('view') === 'record') document.querySelector('[data-view="record"]').click();
const focusName = Q.get('focus');
if (focusName) { const n = nodes.find(x => x.name === focusName); if (n) setTimeout(() => select(n), 3200); }
</script>
</body>
</html>
