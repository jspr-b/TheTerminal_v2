<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Terminal: Products command center, one world (mockup)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#080812;--panel:#0f0f1c;--edge:#22223a;--line:rgba(255,255,255,.07);--text:#e7e7f0;--muted:#8d8da6;--dim:#55556d;--accent:#7c8cff;
  --red:#f87171;--amber:#fbbf24;--green:#34d399;--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);display:flex;overflow:hidden}
button,input,select{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;padding:0;text-align:left}
.untested{font-size:10px;border:1px solid rgba(251,191,36,.4);color:var(--amber);border-radius:4px;padding:0 4px;margin-left:5px}
nav{width:200px;flex:none;border-right:1px solid var(--edge);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
nav .brand{font-weight:600;padding:0 8px 14px}nav a{display:block;padding:7px 10px;border-radius:7px;color:var(--muted)}nav a.on{background:rgba(124,140,255,.12);color:var(--text)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.crumbs{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 20px;border-bottom:1px solid var(--edge);color:var(--muted)}
.crumbs b{color:var(--text);font-weight:500}
.mock{margin-left:auto;font-size:11px;color:var(--amber);border:1px solid rgba(251,191,36,.35);border-radius:99px;padding:2px 9px}
.stage{position:relative;flex:1;min-height:0;background:radial-gradient(75% 75% at 50% 42%,#121427 0%,#0a0a14 55%,#05050b 100%);overflow:hidden}
#world{position:absolute;inset:0}
.top{position:absolute;left:16px;right:16px;top:14px;z-index:3;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0 10px 0 0}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--edge);border-radius:8px;padding:5px 9px;width:200px;background:rgba(12,12,24,.85)}
.search input{background:none;border:0;outline:0;width:100%}
.seg{display:flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden;background:rgba(12,12,24,.85)}
.seg button{white-space:nowrap;padding:5px 10px;color:var(--muted);font-size:12px}.seg button.on{background:rgba(124,140,255,.16);color:var(--text)}
select{background:rgba(12,12,24,.85);border:1px solid var(--edge);border-radius:8px;padding:5px 8px;color:var(--muted)}
.count{color:var(--dim);font-size:12px;white-space:nowrap}
.answer{position:absolute;left:16px;top:52px;z-index:3;color:#c9c9d8;font-size:13px;pointer-events:none;transition:opacity .3s}
.answer .r{color:var(--red)}.answer .a{color:var(--amber)}.answer .g{color:var(--green)}
.back{position:absolute;left:16px;top:52px;z-index:4;display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid rgba(124,140,255,.5);border-radius:9px;background:rgba(20,20,42,.9);font-size:13px;opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity .3s,transform .3s}
.back.on{opacity:1;pointer-events:auto;transform:none}.back kbd{font:11px var(--mono);color:var(--muted);border:1px solid var(--edge);border-radius:4px;padding:0 5px}
.modes{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;padding:6px;border:1px solid var(--edge);border-radius:12px;background:rgba(12,12,22,.86)}
.mrow{display:flex;align-items:center;gap:8px}
.step{width:30px;height:30px;flex:none;border-radius:50%;border:1px solid var(--edge);background:#14142a;color:var(--text);font-size:15px;text-align:center}
.step:hover:not(:disabled){border-color:var(--accent)}.step:disabled{opacity:.3;cursor:default}
.stops{display:flex;gap:4px}
.stops button{font-size:13px;color:var(--muted);padding:6px 14px;border-radius:8px;transition:background .25s,color .25s}.stops button.on{color:var(--text);background:rgba(124,140,255,.16)}
.stops button small{color:var(--dim);margin-left:4px}
.hint{position:absolute;right:16px;bottom:24px;z-index:2;font-size:11px;color:var(--dim);pointer-events:none;text-align:right}
.tip{position:absolute;z-index:5;display:none;padding:7px 10px;border:1px solid var(--edge);border-radius:9px;background:rgba(15,15,28,.95);font-size:12px;pointer-events:none;white-space:nowrap}
.tip b{font-weight:500}.tip .m{color:var(--muted);font-size:11px}
</style>
</head>
<body>
<nav><div class="brand">The Terminal</div><a>Command</a><a class="on">Products</a><a>Customers</a><a>Ads</a><a>Support</a><a>Money</a><a>Connections</a></nav>
<main>
  <div class="crumbs">Products<span id="crumb"></span><span class="mock">Mockup · made-up demo data</span></div>
  <section class="stage" id="stage">
    <div id="world"></div>
    <div class="top">
      <h1>Products</h1>
      <label class="search">⌕<input id="q" placeholder="Search products" aria-label="Search products"></label>
      <div class="seg" id="sort" role="group" aria-label="Sort"><button data-s="runout" class="on">Runs out first</button><button data-s="sold">Sells most</button><button data-s="miss">Kumo missed</button></div>
      <select id="type" aria-label="Product type"><option value="">All types</option></select>
      <span class="count" id="count"></span>
    </div>
    <div class="answer" id="answer">In the next 14 days, sell-out risk is <span class="r">high for 1</span>, <span class="a">medium for 3</span> and <span class="g">low for 12</span> products.<span class="untested">untested</span></div>
    <button class="back" id="back">← Back to all products <kbd>Esc</kbd></button>
    <div class="tip" id="tip"></div>
    <div class="hint" id="hint"></div>
    <div class="modes">
      <div class="mrow"><button class="step" id="prev" aria-label="Previous view">‹</button>
        <div class="stops"><button data-m="0" class="on">Galaxy<small>bought together</small></button><button data-m="1">Skyline<small>sales per day</small></button><button data-m="2">Cards<small>3D list</small></button></div>
        <button class="step" id="next" aria-label="Next view">›</button></div>
    </div>
  </section>
</main>

<script type="module">
const THREE = await import("https://esm.sh/three@0.170.0");
const { OrbitControls } = await import("https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js");
const PRODUCT_PAGE = "product-stage.html"; // the approved product page mockup

/* ---------------- made-up demo shop ---------------- */
let sd = 11; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
const COLORS = { Shirts: "#8fa2ff", Bags: "#7fd6c2", Accessories: "#f2a6d8", Outerwear: "#9fd0ff", Knitwear: "#f5c97a", Art: "#fda4af" };
const P = [["Canvas Tote","Bags",40,110,150,190],["Cotton Tee","Shirts",181,120,158,205],["Linen Shirt","Shirts",179,96,128,164],["Knit Beanie","Knitwear",53,33,47,66],
 ["Card Holder","Accessories",71,38,55,77],["Oxford Shirt","Shirts",120,42,60,84],["Merino Crew","Knitwear",98,30,44,63],["Market Bag","Bags",86,30,41,58],
 ["Wool Scarf","Accessories",60,25,37,52],["Denim Jacket","Outerwear",210,22,31,45],["Bucket Hat","Accessories",146,19,28,40],["Leather Belt","Accessories",164,18,25,37],
 ["Rain Shell","Outerwear",88,14,21,31],["Silk Tie","Accessories",70,12,18,27],["Poster Set","Art",40,6,10,16],["Limited Print","Art",4,null,null,null]];
const today = new Date(); today.setHours(12);
const dn = n => { const d = new Date(today); d.setDate(d.getDate() + n); return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); };
const wk = n => { const w = ((today.getDay() + n) % 7 + 7) % 7; return w === 0 || w === 6 ? 1.4 : w === 5 ? 1.15 : .85; };
const RISK = { high: "#f87171", medium: "#fbbf24", low: "#34d399" };
const prods = P.map(([title, type, stock, lo, mid, hi], id) => {
  const per = (mid ?? 2) / 14, trend = id === 2 || id === 8 ? .5 : id === 6 ? -.45 : 0;
  const past = Array.from({ length: 28 }, (_, i) => Math.max(0, Math.round(per * wk(i - 28) * (.6 + rnd() * .8) * (i >= 21 ? 1 + trend : 1))));
  const f = lo === null ? null : { lo, mid, hi };
  let out = null;
  if (f) { let a = stock, b = stock, e = null, l = null; for (let k = 1; k <= 14; k++) { a -= hi / 14; b -= mid / 14; if (a <= 0 && e === null) e = k; if (b <= 0 && l === null) l = k; } if (e) out = { e, l }; }
  const band = !f ? null : mid >= stock ? "high" : hi >= stock ? "medium" : "low";
  const check = f ? { lo: Math.round(lo * .95), hi: Math.round(hi * .95), actual: Math.round(mid * (id === 8 ? 1.5 : id === 3 ? 1.3 : id === 2 ? .7 : id === 14 ? .55 : .9 + rnd() * .2)) } : null;
  if (check) check.res = check.actual > check.hi ? "above" : check.actual < check.lo ? "below" : "inside";
  return { id, title, type, stock, f, out, band, check, past, sold14: past.slice(14).reduce((a, b) => a + b, 0) };
});
const pairs = [[0,2,83],[0,1,74],[3,6,40],[1,9,37],[13,5,35],[2,11,26],[4,0,22],[10,12,18],[7,0,16],[14,15,9],[8,3,14],[5,2,12],[11,4,8],[6,8,7],[12,9,6]];
const N = prods.length, maxOrders = Math.max(...pairs.map(l => l[2]));
const partners = id => pairs.filter(l => l[0] === id || l[1] === id).map(l => ({ id: l[0] === id ? l[1] : l[0], o: l[2] })).sort((a, b) => b.o - a.o);

/* ---------------- state ---------------- */
let q = "", type = "", sort = "runout", selected = null, hovered = null, hoverTower = null, mode = 0, modeTarget = null, dragging = null, focus = 0;
const matches = p => (!q || p.title.toLowerCase().includes(q)) && (!type || p.type === type);
const order = () => { const key = { runout: p => p.out ? p.out.e : p.f ? 50 : 99, sold: p => -p.sold14, miss: p => p.check ? (p.check.res === "inside" ? 1 : 0) : 2 }[sort];
  return [...prods].sort((a, b) => (matches(b) - matches(a)) || key(a) - key(b) || a.title.localeCompare(b.title)).map(p => p.id); };
let rank = order();

/* ---------------- world ---------------- */
const host = document.getElementById("world"), stage = document.getElementById("stage");
const R = new THREE.WebGLRenderer({ antialias: true, alpha: true }); R.setPixelRatio(Math.min(2, devicePixelRatio)); host.appendChild(R.domElement);
const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x0b0b15, 120, 280);
const cam = new THREE.PerspectiveCamera(38, 1, .1, 800);
const ctl = new OrbitControls(cam, R.domElement); ctl.enableDamping = true; ctl.enablePan = false; ctl.autoRotateSpeed = .35;
scene.add(new THREE.AmbientLight(0xffffff, .6));
const kl = new THREE.DirectionalLight(0xffffff, 1.1); kl.position.set(-30, 60, 40); scene.add(kl);
const rl = new THREE.DirectionalLight(0x7c8cff, .9); rl.position.set(40, 20, -40); scene.add(rl);
const canvasTex = c => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
const mkCanvas = (w, h, draw) => { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); return c; };
const floor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, fog: false,
  map: canvasTex(mkCanvas(512, 512, (g, w) => { const q = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2); [[0, "rgba(150,158,230,.24)"], [.42, "rgba(110,118,190,.10)"], [1, "rgba(0,0,0,0)"]].forEach(([o, c]) => q.addColorStop(o, c)); g.fillStyle = q; g.fillRect(0, 0, w, w); })) }));
floor.rotation.x = -Math.PI / 2; floor.scale.set(140, 110, 1); floor.position.y = -.02; floor.renderOrder = -1; scene.add(floor);

/* text in the world: a sprite with a canvas label (moves with its object, no screen jitter) */
function textSprite(text, { size = 40, color = "#e7e7f0", weight = 500, bg = null } = {}) {
  const pad = bg ? 18 : 6, c0 = document.createElement("canvas").getContext("2d"); c0.font = `${weight} ${size}px IBM Plex Sans, sans-serif`;
  const w = Math.ceil(c0.measureText(text).width) + pad * 2, h = Math.ceil(size * 1.5);
  const c = mkCanvas(w, h, g => { if (bg) { g.fillStyle = bg; g.beginPath(); g.roundRect(0, 0, w, h, h / 2); g.fill(); } g.font = `${weight} ${size}px IBM Plex Sans, sans-serif`; g.fillStyle = color; g.textBaseline = "middle"; g.shadowColor = "#000"; g.shadowBlur = bg ? 0 : 6; g.fillText(text, pad, h / 2); });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: canvasTex(c), transparent: true, depthWrite: false, depthTest: false }));
  s.userData.aspect = w / h; s.renderOrder = 6; scene.add(s); return s;
}
const sizeSprite = (s, h) => s.scale.set(h * s.userData.aspect, h, 1);

/* galaxy layout: a small 3D force layout */
const gal = prods.map(() => new THREE.Vector3((rnd() - .5) * 30, 10 + (rnd() - .5) * 20, (rnd() - .5) * 30));
const pinned = new Set();
function relax(steps, fixed = null) {
  for (let s = 0; s < steps; s++) {
    const f = gal.map(() => new THREE.Vector3());
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) { const d = gal[i].clone().sub(gal[j]); const L = Math.max(1, d.length()); d.multiplyScalar(140 / (L * L * L)); f[i].add(d); f[j].sub(d); }
    pairs.forEach(([a, b, o]) => { const d = gal[b].clone().sub(gal[a]); const L = d.length(), rest = 13 - o / 12; d.multiplyScalar((L - rest) * .04 / Math.max(L, .01)); f[a].add(d); f[b].sub(d); });
    gal.forEach((p, i) => { f[i].add(new THREE.Vector3(0, 10, 0).sub(p).multiplyScalar(.012)); if (i !== fixed && !pinned.has(i)) p.add(f[i].clampLength(0, 2)); });
  }
}
relax(400);
{ const c = gal.reduce((a, v) => a.add(v.clone().divideScalar(N)), new THREE.Vector3()); const far = Math.max(...gal.map(v => v.distanceTo(c)));
  gal.forEach(v => v.sub(c).multiplyScalar(20 / far).add(new THREE.Vector3(0, 11, 0))); }

/* skyline + cards layout */
const SX = 1.0, ROW = 3.1, X0 = -21;
const skyRowZ = r => (r - (N - 1) / 2) * ROW;
const maxDay = Math.max(...prods.flatMap(p => [...p.past, p.f ? p.f.hi / 14 : 0]));
const H = 7 / maxDay;
const cardPos = r => new THREE.Vector3(r % 2 ? 10.5 : -10.5, 30 - Math.floor(r / 2) * 3.6, 0);

/* product objects */
const nodeGeo = new THREE.SphereGeometry(1, 28, 18), box = new THREE.BoxGeometry(.78, 1, 1.9);
function drawRowCard(g, w, h, p, on) {
  g.clearRect(0, 0, w, h);
  g.fillStyle = on ? "rgba(24,24,52,.97)" : "rgba(17,17,31,.94)"; g.strokeStyle = on ? "rgba(157,170,255,.95)" : "rgba(124,140,255,.35)"; g.lineWidth = on ? 5 : 3;
  g.beginPath(); g.roundRect(4, 4, w - 8, h - 8, 26); g.fill(); g.stroke();
  g.fillStyle = COLORS[p.type]; g.beginPath(); g.arc(44, 58, 11, 0, 7); g.fill();
  g.fillStyle = "#e7e7f0"; g.font = "500 36px IBM Plex Sans, sans-serif"; g.fillText(p.title, 72, 70);
  g.fillStyle = "#8d8da6"; g.font = "26px IBM Plex Sans, sans-serif"; g.fillText(`${p.stock} in stock · ${p.f ? `likely ${p.f.lo}–${p.f.hi}` : "too few sales"}`, 72, 118);
  if (p.f) { const x0 = 560, W = 260, m = Math.max(p.stock, p.f.hi) * 1.08, x = v => x0 + v / m * W, c = RISK[p.band];
    g.fillStyle = "rgba(255,255,255,.2)"; g.fillRect(x0, 80, x(p.stock) - x0, 8);
    g.fillStyle = c + "38"; g.strokeStyle = c; g.lineWidth = 2; g.beginPath(); g.roundRect(x(p.f.lo), 64, x(p.f.hi) - x(p.f.lo), 40, 8); g.fill(); g.stroke();
    g.fillStyle = "#e7e7f0"; g.fillRect(x(p.stock) - 2, 58, 4, 52); }
  g.font = "24px IBM Plex Sans, sans-serif"; g.textAlign = "right"; g.fillStyle = p.out ? RISK[p.band] : "#8d8da6";
  g.fillText(!p.f ? "" : p.out ? `run out day ${p.out.e}${p.out.l ? "–" + p.out.l : "+"}` : "lasts 14+ days", w - 34, 94); g.textAlign = "left";
}
const items = prods.map(p => {
  const col = new THREE.Color(COLORS[p.type]);
  const node = new THREE.Mesh(nodeGeo, new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: .55, roughness: .4, transparent: true })); node.userData.id = p.id; scene.add(node);
  const halo = new THREE.Mesh(nodeGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false, side: THREE.BackSide })); scene.add(halo);
  const towers = [];
  p.past.forEach((u, i) => { const m = new THREE.Mesh(box, new THREE.MeshStandardMaterial({ color: 0xc9cbe0, emissive: 0x000000, roughness: .55, transparent: true })); m.userData = { id: p.id, kind: "past", i, u, h: Math.max(.05, u * H) }; scene.add(m); towers.push(m); });
  if (p.f) { let st = p.stock; for (let k = 1; k <= 14; k++) { st -= p.f.mid / 14; const gone = st <= 0;
    const m = new THREE.Mesh(box, new THREE.MeshPhysicalMaterial({ color: gone ? 0xf87171 : 0x7c8cff, emissive: gone ? 0x2a0b0b : 0x1c2266, transparent: true, opacity: .5, roughness: .15 }));
    m.userData = { id: p.id, kind: "ahead", k, gone, h: Math.max(.05, p.f.mid / 14 * H) }; scene.add(m); towers.push(m); } }
  const cc = mkCanvas(1024, 168, (g, w, h) => drawRowCard(g, w, h, p, false)); const ct = canvasTex(cc);
  const card = new THREE.Mesh(new THREE.PlaneGeometry(19, 3.1), new THREE.MeshBasicMaterial({ map: ct, transparent: true, depthWrite: false, side: THREE.FrontSide })); card.userData.id = p.id; scene.add(card);
  const label = textSprite(p.title, { size: 40 });
  return { p, node, halo, towers, card, cardCanvas: cc, cardTex: ct, cardOn: false, label, pos: gal[p.id].clone(), cpos: cardPos(0), z: skyRowZ(0), hmul: 1 };
});

/* links: thin lines, plus glowing tubes, flowing dots and order counts for the product in focus */
const linkMat = pairs.map(() => new THREE.LineBasicMaterial({ color: 0x7c8cff, transparent: true, opacity: .4 }));
const links = pairs.map((l, i) => { const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]), linkMat[i]); scene.add(ln); return ln; });
const tubeGeo = new THREE.CylinderGeometry(1, 1, 1, 12, 1, true);
const tubes = pairs.map(([, , o]) => { const m = new THREE.Mesh(tubeGeo, new THREE.MeshBasicMaterial({ color: 0x9aa6ff, transparent: true, opacity: 0, depthWrite: false })); m.userData.r = .1 + o / maxOrders * .45; scene.add(m); return m; });
const flowGeo = new THREE.SphereGeometry(.28, 10, 8);
const flows = pairs.map(() => Array.from({ length: 5 }, () => { const m = new THREE.Mesh(flowGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 })); scene.add(m); return m; }));
const orderTags = pairs.map(([, , o]) => textSprite(`${o} orders`, { size: 30, color: "#c3c9ff", weight: 500, bg: "rgba(20,20,46,.92)" }));
/* day ticks under the focused skyline row */
const ticks = [-28, -21, -14, -7, 0, 7, 14].map(d => ({ d, s: textSprite(d === 0 ? "today" : dn(d), { size: 30, color: d === 0 ? "#c3c9ff" : "#8d8da6" }) }));
const todayLine = new THREE.Mesh(new THREE.PlaneGeometry(.06, 1), new THREE.MeshBasicMaterial({ color: 0x9aa6ff, transparent: true, opacity: 0, depthWrite: false })); scene.add(todayLine);

/* the selected product's detail card, in the world */
const DW = 1024, DH = 500, dCanvas = document.createElement("canvas"); dCanvas.width = DW; dCanvas.height = DH; const dTex = canvasTex(dCanvas);
const detail = new THREE.Mesh(new THREE.PlaneGeometry(15, 15 * DH / DW), new THREE.MeshBasicMaterial({ map: dTex, transparent: true, depthTest: false, depthWrite: false }));
detail.renderOrder = 10; detail.visible = false; scene.add(detail);
const TETHER_N = 32;
const tether = new THREE.Line(new THREE.BufferGeometry().setFromPoints(Array.from({ length: TETHER_N }, () => new THREE.Vector3())), new THREE.LineBasicMaterial({ color: 0x9aa6ff, transparent: true, opacity: .7, depthTest: false }));
tether.renderOrder = 9; tether.visible = false; scene.add(tether);
let regions = [], pop = 0, shownId = null, hotRegion = null;
/* a light, compact card: few lines, big type, so it stays readable at a small size */
function drawDetail(p) {
  const g = dCanvas.getContext("2d"); g.clearRect(0, 0, DW, DH); regions = [];
  g.fillStyle = "rgba(14,14,28,.88)"; g.strokeStyle = "rgba(124,140,255,.45)"; g.lineWidth = 2; g.beginPath(); g.roundRect(3, 3, DW - 6, DH - 6, 36); g.fill(); g.stroke();
  const T = (t, x, y, f, c, al = "left") => { g.font = f; g.fillStyle = c; g.textAlign = al; g.fillText(t, x, y); g.textAlign = "left"; return g.measureText(t).width; };
  g.fillStyle = COLORS[p.type]; g.beginPath(); g.arc(58, 74, 14, 0, 7); g.fill();
  T(p.title, 88, 92, "600 58px IBM Plex Sans, sans-serif", "#e7e7f0");
  const hc = hotRegion === "close"; T("✕", DW - 60, 92, "40px IBM Plex Sans, sans-serif", hc ? "#e7e7f0" : "#6c6c86", "center"); regions.push({ k: "close", x: DW - 110, y: 40, w: 100, h: 80 });
  // one line of numbers: stock · likely · run-out
  T(String(p.stock), 50, 206, "500 64px IBM Plex Mono, monospace", "#e7e7f0"); T("in stock", 50, 248, "30px IBM Plex Sans, sans-serif", "#8d8da6");
